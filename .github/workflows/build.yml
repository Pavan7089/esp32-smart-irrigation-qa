name: Build firmware
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: if [ -f firmware/include/config.example.h ]; then cp firmware/include/config.example.h firmware/include/config.h; fi
      - run: pio run
